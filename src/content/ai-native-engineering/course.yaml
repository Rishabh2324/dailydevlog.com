# AI-Native Software Engineering course outline — the source of truth for seasons, modules, and topics.
# A topic becomes a live lesson when an MDX file in ./lessons sets `topic: "<id>"`.
# Topic URLs are slugified from `title` unless `slug` is set. Levels: L1 explain the workflow ·
# L2 use it on real tasks · L3 design the workflow · L4 know its limits · L5 roll it out to a team.
# Seasons 5+ (UX onward) are pending the rest of the spec: docs/ai-native-engineering-spec.md.

- id: s1
  number: 1
  title: AI-Native Software Engineering
  summary: What changes when AI joins the lifecycle — the roles it plays, how much autonomy to give it, and the verification discipline that keeps you in charge.
  modules:
    - id: '1.1'
      title: From traditional to AI-native development
      summary: How software is built today, and how AI-assisted and AI-native development differ from it.
      topics:
        - { id: '1.1.1', title: 'AI-assisted vs AI-native development', level: L1 }
        - { id: '1.1.2', title: 'The ladder: from AI assistant to AI-native engineering system', slug: ai-maturity-ladder, level: L1 }
        - { id: '1.1.3', title: 'The AI-native engineering loop', level: L1 }
        - { id: '1.1.4', title: 'Augment, not replace: engineering judgment', slug: engineering-judgment, level: L1 }
    - id: '1.2'
      title: The roles AI plays
      summary: Pair programmer, researcher, planner, reviewer, debugger, architect, agent — and picking the right one.
      topics:
        - { id: '1.2.1', title: 'AI as pair programmer', level: L2 }
        - { id: '1.2.2', title: 'AI as researcher', level: L2 }
        - { id: '1.2.3', title: 'AI as planner', level: L2 }
        - { id: '1.2.4', title: 'AI as reviewer', level: L2 }
        - { id: '1.2.5', title: 'AI as debugging partner', level: L2 }
        - { id: '1.2.6', title: 'AI as architecture thought partner', level: L2 }
        - { id: '1.2.7', title: 'AI as coding agent', level: L2, maturity: Emerging, volatile: true }
        - { id: '1.2.8', title: 'Choosing the right role for a task', slug: choosing-the-role, level: L3 }
    - id: '1.3'
      title: Autonomy and control
      summary: Agentic and autonomous development, who stays in the loop, and how to limit the blast radius.
      topics:
        - { id: '1.3.1', title: 'Agentic development: when AI can act', slug: agentic-development, level: L1, volatile: true }
        - { id: '1.3.2', title: 'Human-in-the-loop vs human-on-the-loop', slug: human-in-vs-on-the-loop, level: L2 }
        - { id: '1.3.3', title: 'Autonomy levels and approval gates', level: L3 }
        - { id: '1.3.4', title: 'When to allow autonomous execution', slug: autonomous-execution, level: L3 }
        - { id: '1.3.5', title: 'Sandboxes, permissions and blast radius', slug: sandboxes-and-permissions, level: L3, volatile: true }
    - id: '1.4'
      title: Risks and verification discipline
      summary: How AI fails, the risks of generated code, over-reliance, and the habit of verifying everything.
      topics:
        - { id: '1.4.1', title: 'How LLMs fail: hallucinations and confident errors', slug: how-llms-fail, level: L1 }
        - { id: '1.4.2', title: "Context limits: what the model can't see", slug: context-limits, level: L1 }
        - { id: '1.4.3', title: 'Risks of AI-generated code', slug: ai-generated-code-risks, level: L2 }
        - { id: '1.4.4', title: 'Over-reliance and skill atrophy', slug: over-reliance, level: L1 }
        - { id: '1.4.5', title: 'Verification discipline', level: L2 }
        - { id: '1.4.6', title: 'When not to use AI', level: L3 }

