# AI Engineering course outline — the source of truth for seasons, modules, and topics.
# A topic becomes a live lesson when an MDX file in ./lessons sets `topic: "<id>"`.
# Topic URLs are slugified from `title` unless `slug` is set. Levels: L1 explain · L2 build ·
# L3 design · L4 internals · L5 operate at scale.
# Slimmed on 2026-09-17 from 295 to 87 topics: one lesson per important idea or term, depth lives in references.

- id: s1
  number: 1
  title: AI & LLM Foundations
  summary: The core ideas behind AI models, from learning from examples to how chatbots write answers.
  modules:
    - id: '1.1'
      title: From AI to deep learning
      summary: What machine learning is, how neural networks learn, and why AI needs so much compute.
      topics:
        - { id: '1.1.1', title: 'AI vs ML vs DL vs GenAI', slug: ai-vs-ml-vs-dl-vs-genai, level: L1 }
        - { id: '1.1.2', title: 'Rules vs learned functions', level: L1 }
        - { id: '1.1.3', title: 'Discriminative vs generative models', level: L1 }
        - { id: '1.1.4', title: 'Neural networks: neurons, layers, activations', slug: neural-networks, level: L1 }
        - { id: '1.1.5', title: 'Parameters, weights and biases', level: L1 }
        - { id: '1.1.6', title: 'Loss functions', level: L1 }
        - { id: '1.1.7', title: 'Gradient descent and optimization', level: L1 }
        - { id: '1.1.8', title: 'Backpropagation (intuition)', slug: backpropagation, level: L1 }
        - { id: '1.1.9', title: 'Training vs inference', level: L1 }
        - { id: '1.1.10', title: 'Overfitting and generalization', level: L1 }
        - { id: '1.1.11', title: 'Model evaluation metrics', level: L1 }
        - { id: '1.1.12', title: 'GPUs and why AI needs compute', slug: gpus-and-compute, level: L1 }
        - { id: '1.1.13', title: 'Scaling laws (intuition)', slug: scaling-laws, level: L1 }
    - id: '1.2'
      title: From words to meaning
      summary: How text becomes numbers a model can use, and how models learned to read context.
      topics:
        - { id: '1.2.1', title: 'Text representation: one-hot, bag-of-words, TF-IDF', slug: text-representation, level: L1 }
        - { id: '1.2.2', title: 'Tokens and tokenization', slug: tokenization, level: L1 }
        - { id: '1.2.3', title: 'Embeddings: meaning as numbers', slug: embeddings-intuition, level: L1 }
        - { id: '1.2.4', title: 'Attention: how models use context', slug: attention-intuition, level: L1 }
    - id: '1.3'
      title: Transformers
      summary: The architecture behind modern AI models, explained without the math.
      topics:
        - { id: '1.3.1', title: 'What a transformer is', slug: what-is-a-transformer, level: L1 }
        - { id: '1.3.2', title: 'Self-attention in plain words', slug: self-attention, level: L1 }
        - { id: '1.3.3', title: 'Context windows and the KV cache', slug: context-window-and-kv-cache, level: L1 }
    - id: '1.4'
      title: How LLMs work
      summary: How large language models are trained, how they write answers, and how to pick one.
      topics:
        - { id: '1.4.1', title: 'What is an LLM?', slug: what-is-an-llm, level: L1 }
        - { id: '1.4.2', title: 'Next-token prediction and temperature', slug: next-token-and-temperature, level: L1 }
        - { id: '1.4.3', title: 'Instruction tuning and RLHF', slug: instruction-tuning-and-rlhf, level: L1 }
        - { id: '1.4.4', title: 'Hallucinations and knowledge cutoffs', slug: hallucinations, level: L1 }
        - { id: '1.4.5', title: 'Reasoning models', level: L1, volatile: true }
        - { id: '1.4.6', title: 'Choosing a model: size, cost, open vs closed', slug: choosing-a-model, level: L1, volatile: true }

- id: s2
  number: 2
  title: Building LLM Applications
  summary: The ideas you need to put an LLM inside a real product.
  modules:
    - id: '2.1'
      title: Prompting
      summary: How to ask a model for what you want, and the main risk of doing it.
      topics:
        - { id: '2.1.1', title: 'Prompts and message roles', slug: prompts-and-roles, level: L1 }
        - { id: '2.1.2', title: 'Zero-shot and few-shot prompting', slug: zero-shot-few-shot, level: L1 }
        - { id: '2.1.3', title: 'Writing clear prompts', level: L2 }
        - { id: '2.1.4', title: 'Prompt injection 101', slug: prompt-injection-101, level: L1 }
    - id: '2.2'
      title: LLM APIs
      summary: What happens when your code calls a model, and what it costs.
      topics:
        - { id: '2.2.1', title: 'Anatomy of an LLM API call', slug: llm-api-anatomy, level: L1, volatile: true }
        - { id: '2.2.2', title: 'Tokens, cost and context limits', slug: tokens-cost-and-limits, level: L1 }
        - { id: '2.2.3', title: 'Rate limits, errors and retries', slug: rate-limits-and-retries, level: L2 }
    - id: '2.3'
      title: Structured outputs
      summary: Getting data your code can trust instead of free text.
      topics:
        - { id: '2.3.1', title: 'Structured outputs and JSON schemas', slug: structured-outputs, level: L1 }
    - id: '2.4'
      title: Streaming and chat
      summary: Why answers appear word by word, and how chat apps remember a conversation.
      frontend: true
      topics:
        - { id: '2.4.1', title: 'Streaming responses', slug: streaming, level: L1 }
        - { id: '2.4.2', title: 'Chat apps and conversation history', slug: conversation-history, level: L1 }
    - id: '2.5'
      title: Evaluation basics
      summary: How to tell whether an AI feature is actually good.
      topics:
        - { id: '2.5.1', title: 'Evals: testing AI output', slug: evals-basics, level: L1 }
        - { id: '2.5.2', title: 'Golden datasets', slug: golden-datasets, level: L1 }

- id: s3
