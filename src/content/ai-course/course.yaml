        - { id: '1.1.13', title: 'Scaling laws (intuition)', slug: scaling-laws, level: L1 }
    - id: '1.2'
      title: NLP foundations and the road to LLMs
      summary: How text becomes numbers, and how classical NLP evolved into attention.
      topics:
        - { id: '1.2.1', title: 'Text representation: one-hot, bag-of-words, TF-IDF', slug: text-representation, level: L1 }
        - { id: '1.2.2', title: 'Vocabulary and out-of-vocabulary words', slug: vocabulary-and-oov, level: L1 }
        - { id: '1.2.3', title: 'Tokenization', level: L2 }
        - { id: '1.2.4', title: 'BPE, WordPiece and SentencePiece', slug: bpe-wordpiece-sentencepiece, level: L2 }
