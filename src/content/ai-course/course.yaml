    - id: '1.3'
      title: Transformers
      summary: Self-attention, the transformer block, and why this architecture changed AI.
      topics:
        - { id: '1.3.1', title: 'Why transformers were created', level: L1 }
        - { id: '1.3.2', title: 'Self-attention: Query, Key, Value', slug: self-attention-qkv, level: L4 }
        - { id: '1.3.3', title: 'Scaled dot-product attention by hand', slug: scaled-dot-product-attention, level: L4 }
