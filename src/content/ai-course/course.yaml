      topics:
        - { id: '3.1.1', title: 'Embedding models', slug: embedding-models, level: L1, volatile: true }
        - { id: '3.1.2', title: 'Similarity: cosine and distance', slug: similarity, level: L1 }
    - id: '3.2'
      title: Search
      summary: Keyword search, semantic search, and how to tell if search results are good.
      topics:
        - { id: '3.2.1', title: 'Keyword search and BM25', slug: keyword-search-bm25, level: L1 }
        - { id: '3.2.2', title: 'Semantic and hybrid search', slug: semantic-and-hybrid-search, level: L1 }
        - { id: '3.2.3', title: 'Search quality: precision, recall, ranking', slug: retrieval-metrics, level: L1 }
    - id: '3.3'
      title: Vector databases
      summary: Where embeddings are stored and searched quickly.
      topics:
        - { id: '3.3.1', title: 'Vector databases and approximate search', slug: vector-databases, level: L1, volatile: true }

