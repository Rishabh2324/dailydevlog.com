        - { id: '1.3.10', title: 'Causal masking', level: L2 }
        - { id: '1.3.11', title: 'Context windows, O(n²) attention and the KV cache', slug: context-window-and-kv-cache, level: L4 }
        - { id: '1.3.12', title: 'Why transformers changed AI', level: L1 }
    - id: '1.4'
      title: How LLMs work
      summary: 'Pretraining, the generation loop, sampling, alignment, reasoning models and model selection.'
